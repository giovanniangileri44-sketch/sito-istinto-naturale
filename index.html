                    </p>
                    <p className="font-sans text-sm text-ink/80 leading-relaxed">
                      I terreni alternano strati sabbiosi e banchi argilloso-calcarei. Nelle sabbie marine la fillossera non è riuscita a propagarsi: questo ha permesso la conservazione di viti storiche su <strong>piede franco</strong>, senza portainnesto americano.
                    </p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
                  <div className="order-2 md:order-1 space-y-4">
                    <span className="font-mono text-xs text-terracotta uppercase tracking-wider font-semibold">02 • Architettura della Vite</span>
                    <h2 className="font-serif text-2xl sm:text-3xl font-medium text-ink">L'Alberello a Ceppo Basso</h2>
                    <p className="font-sans text-sm text-ink/80 leading-relaxed">
                      Le viti sono allevate ad alberello, senza pali di sostegno né fili di ferro. È la forma di potatura ideale per Marsala: la pianta rimane raccolta e bassa, proteggendosi dalle raffiche continue di Scirocco e Ponente.
                    </p>
                    <p className="font-sans text-sm text-ink/80 leading-relaxed">
                      Le foglie ombreggiano i grappoli dal sole estivo cocente, mantenendo l'acidità naturale dell'uva. Tutto il lavoro tra i ceppi è rigorosamente manuale.
                    </p>
                  </div>
                  <div className="order-1 md:order-2">
                    <img 
                      src={IMAGES.harvestGrapes}
                      alt="Vendemmia manuale delle uve" 
                      className="w-full h-80 object-cover border border-line"
                    />
                    <span className="font-mono text-[10px] text-ink/50 mt-2 block">Raccolta manuale a grappolo intero in piccole cassette</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
                  <div>
                    <img 
                      src={IMAGES.cellarTanks}
                      alt="Vasche di cantina e affinamento sulle fecce fini" 
                      className="w-full h-80 object-cover border border-line"
                    />
                    <span className="font-mono text-[10px] text-ink/50 mt-2 block">Affinamento naturale in acciaio sulle fecce fini</span>
                  </div>
                  <div className="space-y-4">
                    <span className="font-mono text-xs text-terracotta uppercase tracking-wider font-semibold">03 • Il Lavoro in Cantina</span>
                    <h2 className="font-serif text-2xl sm:text-3xl font-medium text-ink">Fermentazioni Spontanee e Zero Solforosa</h2>
                    <p className="font-sans text-sm text-ink/80 leading-relaxed">
                      In cantina Leonardo e Vincenzo Angileri non usano prodotti enologici correttivi:
                    </p>
                    <ul className="font-sans text-xs sm:text-sm text-ink/80 space-y-2 list-disc list-inside">
                      <li>Solo lieviti autoctoni presenti sulla buccia delle uve.</li>
                      <li>Nessuna chiarifica e nessuna filtrazione meccanica sterilizzante.</li>
                      <li>Nessuna aggiunta di anidride solforosa in nessuna fase produttiva.</li>
                      <li>Affinamenti lenti in acciaio neutro sulle fecce fini (sur lies).</li>
                    </ul>
                  </div>
                </div>

              </div>
            )}

            {/* VISTA 3: SCHEDA SINGOLO VINO */}
            {view === 'vino' && (
              <div className="px-6 md:px-12 py-16 max-w-5xl mx-auto">
                
                <div className="flex flex-wrap gap-2 sm:gap-3 border-b border-line pb-6 mb-12 font-mono text-xs uppercase tracking-wider">
                  {vini.map(w => (
                    <button
                      key={w.slug}
                      onClick={() => setCurrentWineSlug(w.slug)}
                      className={`px-4 py-2 border transition-all ${
                        currentWineSlug === w.slug
                          ? 'border-ink bg-ink text-white font-semibold'
                          : 'border-line bg-white text-ink/70 hover:border-ink/50'
                      }`}
                    >
                      {w.nome}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
                  
                  <div className="lg:col-span-5 bg-white border border-line p-8 sm:p-12 flex flex-col items-center justify-center">
                    <BottleDisplay wine={wine} className="h-72 sm:h-96" />
                    <div className="mt-8 text-center border-t border-line pt-4 w-full">
                      <span className="font-mono text-[11px] text-ink/60 uppercase block">Capsula in Ceralacca</span>
                      <span className="font-mono text-xs font-semibold" style={{ color: wine.coloreCapsula }}>
                        Sigillata a mano all'origine
                      </span>
                    </div>
                  </div>

                  <div className="lg:col-span-7 space-y-8">
                    <div>
                      <span className="font-mono text-xs uppercase tracking-widest text-terracotta">{wine.denominazione}</span>
                      <h1 className="font-serif text-4xl sm:text-5xl font-bold text-ink mt-1">{wine.nome}</h1>
                      <p className="font-mono text-sm text-ink/60 mt-1">{wine.tipologia} • Annata {wine.annata}</p>
                    </div>

                    <div className="border-l-2 border-terracotta pl-4 py-1">
                      <span className="font-mono text-xs uppercase tracking-wider text-terracotta font-semibold block mb-1">
                        Peculiarità del Vitigno ({wine.vitigno})
                      </span>
                      <p className="font-sans text-sm text-ink/80 leading-relaxed">
                        {wine.peculiarita}
                      </p>
                    </div>

                    <div>
                      <span className="font-mono text-xs uppercase tracking-wider text-ink/50 block mb-1 font-semibold">
                        Profilo ed Espressione Marina
                      </span>
                      <p className="font-sans text-sm text-ink/80 leading-relaxed">
                        {wine.profilo}
                      </p>
                    </div>

                    <div className="border border-line divide-y divide-line text-xs font-mono bg-white">
                      <div className="p-3 bg-sandstone/40 font-semibold uppercase tracking-wider">
                        Specifiche di Coltivazione e Cantina
                      </div>
                      <div className="p-3 grid grid-cols-3">
                        <span className="text-ink/50 uppercase">Vinificazione</span>
                        <span className="col-span-2 text-ink leading-relaxed">{wine.vinificazione}</span>
                      </div>
                      <div className="p-3 grid grid-cols-3">
                        <span className="text-ink/50 uppercase">Affinamento</span>
                        <span className="col-span-2 text-ink leading-relaxed">{wine.affinamento}</span>
                      </div>
                      <div className="p-3 grid grid-cols-3">
                        <span className="text-ink/50 uppercase">Suolo</span>
                        <span className="col-span-2 text-ink">{wine.suolo}</span>
                      </div>
                      <div className="p-3 grid grid-cols-3">
                        <span className="text-ink/50 uppercase">Allevamento</span>
                        <span className="col-span-2 text-ink">{wine.sistemaAllevamento}</span>
                      </div>
                      <div className="p-3 grid grid-cols-3">
                        <span className="text-ink/50 uppercase">Altitudine</span>
                        <span className="col-span-2 text-ink font-semibold">{wine.altitudine}</span>
                      </div>
                      <div className="p-3 grid grid-cols-3">
                        <span className="text-ink/50 uppercase">Gradazione</span>
                        <span className="col-span-2 text-ink font-semibold">{wine.gradazione}</span>
                      </div>
                    </div>

                    <div className="pt-2 flex flex-wrap items-center gap-4">
                      <a
                        href={`https://wa.me/${contatti.whatsapp}?text=${encodeURIComponent(`Salve, vorrei informazioni e disponibilità per il vino ${wine.nome} (${wine.annata}) da Istinto Naturale.`)}`}
                        target="_blank"
                        className="py-3 px-6 bg-ink text-white font-mono text-xs uppercase tracking-widest hover:bg-terracotta transition-colors"
                      >
                        Richiedi Disponibilità via WhatsApp
                      </a>
                      <button
                        onClick={() => setView('elabel')}
                        className="py-3 px-4 border border-line bg-white font-mono text-xs uppercase tracking-widest text-ink/70 hover:border-ink transition-colors"
                      >
                        E-Label Normativa UE
                      </button>
                    </div>

                  </div>

                </div>

              </div>
            )}

            {/* VISTA 4: CONTATTI */}
            {view === 'contatti' && (
              <div className="px-6 md:px-12 py-20 max-w-3xl mx-auto">
                <span className="font-mono text-xs uppercase tracking-widest text-terracotta">AZIENDA AGRICOLA A MARSALA</span>
                <h1 className="font-serif text-4xl sm:text-5xl font-normal text-ink mt-2 mb-8">
                  Contatti e Informazioni
                </h1>

                <p className="font-sans text-base text-ink/80 leading-relaxed mb-12">
                  Istinto Naturale è una cantina artigianale indipendente. Per informazioni sulla disponibilità delle annate, per visitare i vigneti ad alberello o per metterti in contatto con noi, puoi usare i recapiti diretti qui sotto.
                </p>

                <div className="border border-line divide-y divide-line bg-white font-mono text-xs">
                  <div className="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span className="text-ink/50 uppercase">Fondatore & Vignaiolo</span>
                    <span className="font-semibold text-ink">{contatti.fondatore}</span>
                  </div>
                  <div className="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span className="text-ink/50 uppercase">Socio</span>
                    <span className="font-semibold text-ink">{contatti.socio}</span>
                  </div>
                  <div className="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span className="text-ink/50 uppercase">Sede Vigneti e Cantina</span>
                    <span className="text-ink">{contatti.luogo} ({contatti.coordinate})</span>
                  </div>
                  <div className="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span className="text-ink/50 uppercase">Telefono & WhatsApp</span>
                    <a href={`https://wa.me/${contatti.whatsapp}`} target="_blank" className="text-terracotta underline font-semibold">
                      {contatti.whatsappDisplay}
                    </a>
                  </div>
                  <div className="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span className="text-ink/50 uppercase">Posta Elettronica</span>
                    <a href={`mailto:${contatti.email}`} className="text-ink underline">
                      {contatti.email}
                    </a>
                  </div>
                  <div className="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span className="text-ink/50 uppercase">Instagram Ufficiale</span>
                    <a href={contatti.instagramUrl} target="_blank" className="text-ink underline">
                      {contatti.instagram}
                    </a>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-line bg-sandstone/30 px-6 md:px-12 py-10 mt-16 font-mono text-xs text-ink/60">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <CircularLogo src={IMAGES.logo} className="w-9 h-9" />
                <div>
                  <strong className="text-ink font-serif text-lg tracking-wider">ISTINTO NATURALE</strong>
                  <span className="block text-[11px] text-ink/50">Leonardo Angileri & Vincenzo Angileri • Marsala (TP) • 0m s.l.m.</span>
                </div>
              </div>

              <div className="flex gap-6 text-[11px]">
                <button onClick={() => setView('home')} className="hover:text-ink">I Vini</button>
                <button onClick={() => setView('vigna-cantina')} className="hover:text-ink">Vigna & Cantina</button>
                <button onClick={() => setView('contatti')} className="hover:text-ink">Contatti</button>
                <button onClick={() => { setCurrentWineSlug('principino'); setView('elabel'); }} className="text-terracotta hover:underline">E-Label UE</button>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
